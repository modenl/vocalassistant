<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Separation test</title>
<style>body{font:15px -apple-system,sans-serif;background:#12151c;color:#e8ebf1;padding:16px}a{color:#8fb8f0;display:block;margin:8px 0}pre{white-space:pre-wrap;font-size:12px}</style>
<h3>Vocal separation test</h3>
<p>Runs 16 s of a synthetic song through one model; every step is sent to the site's diagnostics log.</p>
<a href="?v=split-gpu">fp16, 21 pieces, WebGPU</a>
<a href="?v=split-gpu-cpuio">fp16, 21 pieces, WebGPU, hand-overs through the CPU</a>
<a href="?v=full-gpu">fp32, one file, WebGPU</a>
<a href="?v=full-cpu">fp32, one file, CPU</a>
<pre id="out"></pre>
<script type="module">
// A page to find which model and backend a browser (WebKit's WebGPU) can run,
// one per load (a crash takes the page with it). Not linked from the app.
import { separateVocals } from './js/along/separate.js';
import { dlog, dlogStart } from './js/dlog.js';
import { song } from './tools/speedtest-song.js';
const v = new URLSearchParams(location.search).get('v'), out = document.getElementById('out');
const say = (t) => { out.textContent += t + '\n'; };
if (v) {
  dlogStart(); dlog('sep-test', { variant: v }); say(`running ${v}…`);
  // a heartbeat: stops if the page dies, goes on if the model only hangs
  let beat = 0; setInterval(() => dlog('alive', { beat: ++beat }), 3000);
  const x = song().slice(0, 16 * 44100), t0 = performance.now();
  separateVocals(x, { variant: v, onProgress: (d) => { if (d.stage === 'separate') say(`segment ${Math.round(d.progress * 100)}%`); } })
    .then((r) => { const s = ((performance.now() - t0) / 1000).toFixed(1); dlog('sep-test-done', { variant: v, secs: +r.secs.toFixed(1), total: +s }); say(`done: ${r.secs.toFixed(1)} s separating, ${s} s in all (${r.device})`); })
    .catch((e) => { dlog('sep-test-error', { variant: v, msg: String(e.message).slice(0, 300) }); say(`error: ${e.message}`); });
}
</script>
